<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Combien rapporte chaque année ?" font-family="Helvetica, Arial, sans-serif"><rect width="760" height="380" fill="#fffefb" rx="8"/><text x="24" y="38" font-size="19" fill="#0b1638" text-anchor="start" font-weight="bold">Combien rapporte chaque année ?</text><text x="24" y="60" font-size="12.5" fill="#5b6275" text-anchor="start" font-weight="normal">Rendement annualisé : les bons projets face à la moyenne du marché</text><text x="24" y="106" font-size="13" fill="#0b1638" text-anchor="start" font-weight="normal">Grand Avenue (cas client)</text><path d="M330,90 H642.75 Q646.75,90 646.75,94 V112 Q646.75,116 642.75,116 H330 Z" fill="#112150"/><text x="654.75" y="108" font-size="12.5" fill="#0b1638" text-anchor="start" font-weight="bold">36,2 % / an</text><text x="24" y="154" font-size="13" fill="#0b1638" text-anchor="start" font-weight="normal">Archi Universe (2024 → 2026)</text><path d="M330,138 H522.875 Q526.875,138 526.875,142 V160 Q526.875,164 522.875,164 H330 Z" fill="#112150"/><text x="534.875" y="156" font-size="12.5" fill="#0b1638" text-anchor="start" font-weight="bold">22,5 % / an</text><text x="24" y="202" font-size="13" fill="#0b1638" text-anchor="start" font-weight="normal">Archi Isani (2017 → 2026)</text><path d="M330,186 H438.875 Q442.875,186 442.875,190 V208 Q442.875,212 438.875,212 H330 Z" fill="#112150"/><text x="450.875" y="204" font-size="12.5" fill="#0b1638" text-anchor="start" font-weight="bold">12,9 % / an</text><text x="24" y="250" font-size="13" fill="#0b1638" text-anchor="start" font-weight="normal">Archi Central Park (2019 → 2026)</text><path d="M330,234 H429.25 Q433.25,234 433.25,238 V256 Q433.25,260 429.25,260 H330 Z" fill="#112150"/><text x="441.25" y="252" font-size="12.5" fill="#0b1638" text-anchor="start" font-weight="bold">11,8 % / an</text><text x="24" y="298" font-size="13" fill="#0b1638" text-anchor="start" font-weight="normal">Marché géorgien (Geostat, 2020 → 2026)</text><path d="M330,282 H401.25 Q405.25,282 405.25,286 V304 Q405.25,308 401.25,308 H330 Z" fill="#cbb291"/><text x="413.25" y="300" font-size="12.5" fill="#0b1638" text-anchor="start" font-weight="bold">8,6 % / an</text><line x1="330" y1="84" x2="330" y2="324" stroke="#5b6275"/><text x="24" y="364" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">Sources : Archi ; Geostat, indice des prix du logement (+63,8 % depuis 2020, T2 2026). Grand Avenue : cas client.</text></svg>