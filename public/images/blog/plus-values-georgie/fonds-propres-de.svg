ont-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">Wertgewinn: 38'674 $ in beiden Fällen. Annahme: 20 % Anzahlung, Rest in 28 zinsfreien Monatsraten, gleicher Preis; ohne Gebühren und Steuern.</text></svg>