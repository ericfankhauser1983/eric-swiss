<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Same apartment, two ways to pay" font-family="Helvetica, Arial, sans-serif"><rect width="760" height="300" fill="#fffefb" rx="8"/><text x="24" y="38" font-size="19" fill="#0b1638" text-anchor="start" font-weight="bold">Same apartment, two ways to pay</text><text x="24" y="60" font-size="12.5" fill="#5b6275" text-anchor="start" font-weight="normal">Grand Avenue by Archi: 60.4 m², bought for $97,224, resold for $135,898 after 13 months</text><text x="24" y="100" font-size="14" fill="#0b1638" text-anchor="start" font-weight="bold">100% paid at signing</text><text x="24" y="117" font-size="11.5" fill="#5b6275" text-anchor="start" font-weight="normal">$97,224 invested · +39.8% in 13 months</text><path d="M24,126 H283.11219512195123 Q287.11219512195123,126 287.11219512195123,130 V148 Q287.11219512195123,152 283.11219512195123,152 H24 Z" fill="#cbb291"/><text x="295.11219512195123" y="145" font-size="16" fill="#0b1638" text-anchor="start" font-weight="bold">36.2% p.a.</text><text x="295.11219512195123" y="161" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">annualised return on equity</text><text x="24" y="192" font-size="14" fill="#0b1638" text-anchor="start" font-weight="bold">20% down + interest-free instalments</text><text x="24" y="209" font-size="11.5" fill="#5b6275" text-anchor="start" font-weight="normal">≈ $55,557 invested · +69.6% in 13 months</text><path d="M24,218 H476.4487804878048 Q480.4487804878048,218 480.4487804878048,222 V240 Q480.4487804878048,244 476.4487804878048,244 H24 Z" fill="#112150"/><text x="488.4487804878048" y="237" font-size="16" fill="#0b1638" text-anchor="start" font-weight="bold">62.8% p.a.</text><text x="488.4487804878048" y="253" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">annualised return on equity</text><text x="24" y="284" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">Capital gain: $38,674 in both cases. Assumption: 20% down, balance in 28 interest-free monthly instalments, same price; fees and taxes not deducted.</text></svg>