<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Same apartment, two ways to pay" font-family="Helvetica, Arial, sans-serif"><rect width="760" height="300" fill="#fffefb" rx="8"/><text x="24" y="38" font-size="19" fill="#0b1638" text-anchor="start" font-weight="bold">Same apartment, two ways to pay</text><text x="24" y="60" font-size="12.5" fill="#5b6275" text-anchor="start" font-weight="normal">Grand Avenue by Archi: 60.4 m², bought for $97,224, resold for $135,898 after 13 months</text><text x="24" y="100" font-size="14" fill="#0b1638" text-anchor="start" font-weight="bold">100% paid at signing</text><text x="24" y="117" font-size="11.5" fill="#5b6275" text-anchor="start" font-weight="normal">$97,224 invested · +39.8% in 13 months</text><path d="M24,126 H120.34976744186046 Q124.34976744186046,126 124.34976744186046,130 V148 Q124.34976744186046,152 120.34976744186046,152 H24 Z" fill="#cbb291"/><text x="132.34976744186048" y="145" font-size="16" fill="#0b1638" text-anchor="start" font-weight="bold">36.2% p.a.</text><text x="132.34976744186048" y="161" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">annualised return on equity</text><text x="24" y="192" font-size="14" fill="#0b1638" text-anchor="start" font-weight="bold">20% down, balance financed at handover</text><text x="24" y="209" font-size="11.5" fill="#5b6275" text-anchor="start" font-weight="normal">$19,445 invested · +198.9% in 13 months</text><path d="M24,218 H504.2846511627907 Q508.2846511627907,218 508.2846511627907,222 V240 Q508.2846511627907,244 504.2846511627907,244 H24 Z" fill="#112150"/><text x="516.2846511627906" y="237" font-size="16" fill="#0b1638" text-anchor="start" font-weight="bold">175% p.a.</text><text x="516.2846511627906" y="253" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">annualised return on equity</text><text x="24" y="284" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">Capital gain: $38,674 in both cases. Assumption: 20% down, nothing else due before handover, same price; fees and taxes not deducted.</text></svg>