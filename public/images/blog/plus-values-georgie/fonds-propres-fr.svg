<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Même appartement, deux façons de payer" font-family="Helvetica, Arial, sans-serif"><rect width="760" height="300" fill="#fffefb" rx="8"/><text x="24" y="38" font-size="19" fill="#0b1638" text-anchor="start" font-weight="bold">Même appartement, deux façons de payer</text><text x="24" y="60" font-size="12.5" fill="#5b6275" text-anchor="start" font-weight="normal">Grand Avenue by Archi : 60,4 m², acheté 97 224 $, revendu 135 898 $ après 13 mois</text><text x="24" y="100" font-size="14" fill="#0b1638" text-anchor="start" font-weight="bold">Paiement 100 % à la signature</text><text x="24" y="117" font-size="11.5" fill="#5b6275" text-anchor="start" font-weight="normal">fonds propres engagés : 97 224 $</text><path d="M24,126 H316.51 Q320.51,126 320.51,130 V148 Q320.51,152 316.51,152 H24 Z" fill="#cbb291"/><text x="328.51" y="145" font-size="16" fill="#0b1638" text-anchor="start" font-weight="bold">39,8 %</text><text x="328.51" y="161" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">rendement sur fonds propres</text><text x="24" y="192" font-size="14" fill="#0b1638" text-anchor="start" font-weight="bold">Apport 20 % + mensualités sans intérêts</text><text x="24" y="209" font-size="11.5" fill="#5b6275" text-anchor="start" font-weight="normal">fonds propres engagés : ≈ 55 557 $ (hypothèse)</text><path d="M24,218 H538.52 Q542.52,218 542.52,222 V240 Q542.52,244 538.52,244 H24 Z" fill="#112150"/><text x="550.52" y="237" font-size="16" fill="#0b1638" text-anchor="start" font-weight="bold">69,6 %</text><text x="550.52" y="253" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">rendement sur fonds propres</text><text x="24" y="284" font-size="10.5" fill="#5b6275" text-anchor="start" font-weight="normal">Plus-value : 38 674 $ dans les deux cas. Hypothèse : 20 % d'apport, solde en 28 mensualités sans intérêts, au même prix ; frais et impôts non déduits.</text></svg>