passions:
  eyebrow: "Was mich antreibt"
  items:
    - key: rugby
      title: "Sport – allen voran Rugby"
      text: "Sport gibt mir tägliche Disziplin und hilft mir, den Kopf frei zu bekommen. Vor allem Rugby: ein kollektiver Kampfsport, in dem man nur gemeinsam vorwärtskommt. Seit diesem Jahr gehöre ich zum Staff der iranischen Nationalmannschaft – kürzlich haben wir unter anderem gegen Armenien gewonnen."
    - key: travel
      title: "Reisen"
      text: "Reisen öffnet mich für die Welt, beruflich wie privat. So bilde ich mir meine eigene Meinung über die Kulturen und Realitäten unseres Planeten, fernab von Vorurteilen."

quote:
  text: "Mit meinen Kunden investieren und sie während der gesamten Lebensdauer ihrer Investition begleiten – mit einem Ziel: ihr Vermögen über die Jahre und Projekte hinweg zu vermehren."
  author: "Eric Fankhauser"

values:
  eyebrow: "Was mich leitet"
  items:
    - title: "Kampfgeist"
      text: "Angesichts von Widrigkeiten weicht man nicht zurück: Man passt sich an, steht auf und geht weiter."
    - title: "Anspruch"
      text: "Das ständige Streben nach Leistung und Exzellenz, in jedem Projekt und jedem Detail."
    - title: "Treue"
      text: "Beziehungen, die halten: Meine Kunden werden oft zu Freunden, manchmal zu Partnern."
