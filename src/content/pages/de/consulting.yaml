georgia:
  eyebrow: "Spezialisierung Georgien"
  title: "Sich in Georgien ansiedeln und entwickeln"
  text: "Georgien bietet eines der günstigsten steuerlichen und administrativen Umfelder der Region: Eine Firma wird in der Regel an einem Arbeitstag eingetragen, reinvestierte Gewinne sind steuerfrei, und das Land hat Freihandelsabkommen mit der Europäischen Union, der EFTA (inklusive Schweiz) und China. Für eine erfolgreiche Ansiedlung braucht es jedoch die richtigen Kontakte vor Ort."
  services:
    - "Marktstudie und Validierung der Chance"
    - "Rechtliche und steuerliche Strukturierung der Ansiedlung"
    - "Bankbeziehungen und Kontoeröffnung"
    - "Vermittlung von Partnern, Lieferanten und Kunden"
    - "Institutionelle Beziehungen und Begleitung bei Behörden"
    - "Rekrutierung, Räumlichkeiten und operativer Start"

