faq:
  eyebrow: "Häufige Fragen"
  title: "Eine Firma in Georgien gründen und entwickeln"
  items:
    - q: "Kann ein Ausländer in Georgien eine Firma gründen?"
      a: "Ja. Ein Ausländer kann 100 % einer georgischen Firma halten, ohne lokalen Partner. Die Eintragung erfolgt bei der Nationalen Agentur des öffentlichen Registers (Public Service Halls), in der Regel an einem Arbeitstag, und ist per Vollmacht auch aus der Ferne möglich."
    - q: "Wie werden Unternehmen in Georgien besteuert?"
      a: "Georgien wendet das estnische Modell an: Die Gewinnsteuer von 15 % fällt nur auf ausgeschüttete Gewinne an. Reinvestierte Gewinne sind steuerfrei, Dividenden werden mit 5 % besteuert. Je nach Tätigkeit gibt es Sonderregelungen: Kleinunternehmerstatus (1 % des Umsatzes für Einzelunternehmer, unter Bedingungen), Virtual-Zone-Status für IT-Firmen und Freie Industriezonen."
    - q: "Wie lange dauert die Eröffnung eines Geschäftskontos?"
      a: "Nach der Eintragung der Firma rechnen Sie mit einigen Tagen bis einigen Wochen, je nach Profil und Qualität der Unterlagen. Wir bereiten das Dossier mit Ihnen vor und stellen Sie den Banken direkt vor."
    - q: "Warum Georgien für ein Schweizer oder europäisches KMU?"
      a: "Wegen der Steuern, der schnellen Verfahren, der Arbeitskosten und der Lage zwischen Europa und Asien. Die Freihandelsabkommen mit der EU, der EFTA und China machen das Land zu einer regionalen Plattform für Produktion, Export oder Support-Funktionen."
    - q: "Brauche ich eine Arbeitsbewilligung in Georgien?"
      a: "Seit März 2026 kann das Gesetz über die Arbeitsmigration für bestimmte Ausländer, die in Georgien tätig sind, eine Arbeitsbewilligung verlangen. Wir prüfen Ihre Situation und begleiten Sie bei den Formalitäten."
    - q: "Wie läuft Ihre Begleitung ab?"
      a: "Wir beginnen mit einem Gespräch, um Ihr Projekt zu verstehen. Dann prüfen wir die Chance, wählen die Struktur, bereiten Eintragung und Bankbeziehung vor und öffnen Ihnen unser Netzwerk: Unternehmen, Banken, Institutionen und Regierung. Auch nach dem Start bleiben wir an Ihrer Seite."
