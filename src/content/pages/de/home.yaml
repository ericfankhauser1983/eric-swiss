# Startseite — DE
seo:
  title: "Eric Fankhauser — Immobilien-Investment und Unternehmensberatung in Georgien"
  description: "Schweizer Unternehmer mit Sitz in Tiflis: Immobilien-Investments in Georgien mit FFI, dem Marktführer, und Unternehmensberatung für die Ansiedlung in Georgien. Advisory Board für Schweizer KMU."

hero:
  eyebrow: "Schweiz · Europa · Vereinigte Arabische Emirate · Georgien"
  title: "Eric Fankhauser"
  subtitle: "Unternehmer, Investor und Strategieberater"
  lead: "Fünfundzwanzig Jahre Karriere – von Swissair über Restrukturierungen bis zur Gründung von Swiss Auto Glass – haben mich eines gelehrt: Kapital wächst wie ein Unternehmen, mit Methode, vor Ort und über die Zeit. Von Tiflis aus stelle ich diese Überzeugung gemeinsam mit meinen Partnern in den Dienst von Investoren und Unternehmern."
  stats:
    - value: "1’000+"
      label: "begleitete Kunden in Georgien mit FFI"
    - value: "Millionen"
      label: "jeden Monat für unsere Kunden investiert"
    - value: "25 Jahre"
      label: "Karriere, von Swissair bis zum internationalen Unternehmertum"

paths:
  eyebrow: "Wie ich Ihnen helfen kann"
  title: "Alles beginnt bei Ihrer Situation"
  lead: "Ob Ihr Kapital mehr leisten, Ihr Unternehmen wachsen oder Sie im Alltag besser entscheiden sollen – der Ansatz ist derselbe: verstehen, wo Sie stehen, und mit Ihnen die Strategie entwickeln, die Sie weiterbringt."

pillars:
  items:
    - key: invest
      question: "Ihr Kapital liegt brach oder bringt zu wenig?"
      kicker: "FFI · Real Estate Asset Management"
      title: "Immobilien-Investment in Georgien"
      text: "Mit FFI, meinem Unternehmen und Marktführer: über 1’000 begleitete Kunden und jeden Monat mehrere Millionen investiert in Batumi und Tiflis – für Privatpersonen, Family Offices und Fonds."
      cta: "In Georgien investieren"
    - key: consulting
      question: "Ihr Unternehmen muss den nächsten Schritt machen oder sich in Georgien ansiedeln?"
      kicker: "Strategieberatung"
      title: "Strategie, Entwicklung und Organisation von KMU"
      text: "Ein externer Blick, um Ihr Unternehmen voranzubringen – und ein hochrangiger Zugang für die Ansiedlung in Georgien."
      cta: "Strategieberatung"
    - key: board
      question: "Sie führen ein Schweizer KMU und entscheiden oft allein?"
      kicker: "Advisory Board"
      title: "Ein Expertengremium für Ihr Schweizer KMU"
      text: "Jährliche Standortbestimmung und vier Strategiesitzungen pro Jahr, für CHF 2’500 pro Monat."
      cta: "Das Advisory Board"

about:
  eyebrow: "Mein Werdegang"
  title: "Vom 15-jährigen Lehrling zum internationalen Unternehmer"
  text: "Swissair, New York am 11. September 2001, der Aufbau eines Callcenters, die Restrukturierung eines Unternehmens, dann zehn Jahre, um Swiss Auto Glass zur Nummer drei der Schweiz zu machen. Heute lebe ich in Tiflis und stelle diese Erfahrung in den Dienst meiner Kunden."
  cta: "Meine Geschichte lesen"

team:
  eyebrow: "Das Team"
  title: "Sie arbeiten nie mit mir allein"
  text: "Jede Tätigkeit stützt sich auf Partner und anerkannte Experten in der Schweiz, in Europa und in Georgien."
  cta: "Das Team kennenlernen"

final:
  title: "Sprechen wir über Ihr Projekt"
  text: "Ein erstes, unverbindliches Gespräch, um Ihre Ziele zu verstehen und zu sehen, wie wir Sie begleiten können."
