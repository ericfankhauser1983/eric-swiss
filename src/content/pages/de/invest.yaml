# Immobilien-Investment — Real Estate Asset Management — DE
seo:
  title: "In Immobilien in Georgien investieren (Batumi, Tiflis) — Real Estate Asset Management"
  description: "Schlüsselfertige Immobilien-Investments in Georgien: Auswahl, Erwerb, Vermietung und Verkauf in Batumi und Tiflis. Rechner: Barzahlung, Zahlungsplan oder Bankkredit."

hero:
  eyebrow: "FFI · Real Estate Asset Management"
  title: "FFI, Marktführer für Immobilien-Investments in Georgien"
  lead: "Mit FFI, dem Unternehmen, das ich mit meinen Partnern Adrien Boucher und Léo Lawless führe, haben wir bereits über 1’000 Kunden begleitet und investieren jeden Monat mehrere Millionen in den georgischen Markt – im Auftrag von Privatpersonen, Family Offices und Investmentfonds. Unsere Strategie passen wir jedem Kunden, seinen Bedürfnissen und seiner Situation an, mit einem einzigen Ziel: sein Vermögen zu vermehren."

what:
  eyebrow: "Was wir tun"
  title: "Ein Immobilien-Asset-Manager, nicht bloss ein Verkäufer"
  text: "Eine erfolgreiche Investition entscheidet sich entlang der ganzen Kette: gut kaufen, gut verwalten, gut verkaufen. Wir beherrschen jeden Schritt und bleiben auch nach der Unterzeichnung an Ihrer Seite – für Umschichtungen, Verkäufe und Reinvestitionen."
  steps:
    - title: "Erwerb"
      text: "Sorgfältige Auswahl von Bauträger, Projekt und Lage. Zugang zu Vorverkäufen und Verhandlung der Konditionen: Preis, Rabatt, Zahlungsplan."
    - title: "Verwaltung"
      text: "Schlüsselfertige Einrichtung, Kurz- oder Langzeitvermietung, Überwachung von Einnahmen und Unterhalt. Sie erhalten Ihre Mieten, ohne sich um den Alltag zu kümmern."
    - title: "Verkauf & Umschichtung"
      text: "Den richtigen Zeitpunkt für den Verkauf wählen, den Gewinn neu allokieren und in neue Projekte reinvestieren: Ihr Vermögen bleibt in Bewegung."

why:
  eyebrow: "Warum wir es tun"
  title: "Mit unseren Kunden investieren und sie während der gesamten Investition begleiten"
  text: "Unsere Mission ist einfach: mit unseren Kunden investieren und sie während der gesamten Lebensdauer ihrer Investition begleiten – Umschichtungen, Verkäufe, Reinvestitionen – mit dem einzigen Ziel, ihr Vermögen über die Jahre und Projekte hinweg zu vermehren."

