criteria:
  eyebrow: "Unsere Auswahlkriterien"
  title: "Drei Filter vor jeder Empfehlung"
  items:
    - title: "Der Bauträger"
      text: "Finanzielle Solidität, Erfahrung bei der Fertigstellung, Bauqualität und Verlässlichkeit."
    - title: "Das Projekt"
      text: "Konzept, Ausstattung, Vermietungsservices und Wiederverkaufspotenzial."
    - title: "Die Lage"
      text: "Touristische oder Wohnattraktivität, Erreichbarkeit, Umgebung und Perspektiven des Quartiers."

financing:
  eyebrow: "Finanzierung"
  title: "Drei Arten zu kaufen"
  items:
    - title: "Zahlung zu 100 %"
      text: "Die vollständige Zahlung bei Unterzeichnung ermöglicht den besten Rabatt auf den Preis."
    - title: "Zahlungsplan"
      text: "Eine Anzahlung bei Unterzeichnung, danach der Restbetrag in zinsfreien Monatsraten direkt beim Bauträger während der Bauphase."
    - title: "Bankkredit"
      text: "Eine Anzahlung bei Unterzeichnung, danach wird der Restbetrag bei Übergabe von einer georgischen Bank finanziert: Hebelwirkung im Dienst Ihrer Rendite."

payment:
  eyebrow: "Zahlungsarten"
  title: "Einfach bezahlen, wo immer Sie sind"
  items:
    - title: "Banküberweisung"
      text: "Internationale Überweisung in USD, EUR oder CHF, direkt an den Bauträger."
    - title: "Kryptowährungen"
      text: "Die Zahlung in Kryptowährungen ist für den gesamten Kaufpreis oder einen Teil davon möglich."
    - title: "Bankkonto in Georgien"
      text: "Wir begleiten Sie bei der Eröffnung eines lokalen Bankkontos für Ihre Zahlungen und Mieteinnahmen."

