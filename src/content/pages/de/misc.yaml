privacy:
  seo:
    title: "Datenschutzerklärung"
    description: "Datenschutzerklärung der Website eric.swiss."
  title: "Datenschutzerklärung"
  body: |
    ## Verantwortliche Stelle
    Eric Fankhauser — contact@eric.swiss

    ## Erhobene Daten
    Wenn Sie den Rechner nutzen, erheben wir Ihren Vornamen, Nachnamen, Ihre E-Mail-Adresse, Ihre WhatsApp-Nummer sowie die Angaben und Ergebnisse Ihrer Simulation. Diese Daten werden verwendet, um Sie zu Ihrem Projekt zu kontaktieren, und nur auf Ihren Wunsch, um Ihnen unseren Newsletter zu senden.

    ## Newsletter
    Wenn Sie das entsprechende Kästchen ankreuzen, werden Ihr Vorname, Nachname, Ihre E-Mail-Adresse und Ihre WhatsApp-Nummer in unsere Verteilerliste aufgenommen, die von Brevo (Sendinblue SAS, Frankreich) verwaltet wird. Sie können sich jederzeit über den Link in jeder Sendung oder per E-Mail an contact@eric.swiss abmelden.

    ## Terminbuchung
    Die Terminbuchung erfolgt über Calendly. Die eingegebenen Daten werden gemäss der Datenschutzerklärung von Calendly verarbeitet.

    ## Aufbewahrungsdauer
    Ihre Daten werden so lange aufbewahrt, wie es für die Bearbeitung Ihrer Anfrage erforderlich ist, höchstens jedoch drei Jahre nach dem letzten Kontakt.

    ## Cookies
    Diese Website verwendet keine Werbe-Cookies. Lediglich Ihre Sprachpräferenz wird in Ihrem Browser gespeichert.

    ## Ihre Rechte
    Gemäss dem Schweizer Bundesgesetz über den Datenschutz (revDSG) und der DSGVO haben Sie das Recht auf Auskunft, Berichtigung und Löschung Ihrer Daten. Wenden Sie sich dazu an contact@eric.swiss.
