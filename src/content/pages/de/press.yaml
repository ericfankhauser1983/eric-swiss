  - media: "L’Investisseur Immobilier Magazine"
    meta: "Nr. 4 · September / Oktober 2026 · Porträt und Interview"
    title: "«Wir sind keine Agentur»"
    text: "In einem fünfseitigen Porträt mit Interview beleuchtet das französische Magazin meinen Werdegang und die Art, wie wir mit FFI in Georgien investieren: meine Begegnung mit Adrien Boucher, unser erster Kauf in Batumi, die Unterschiede zwischen Tiflis und Batumi, der Erwerb von Eigentum aus der Ferne, die Besteuerung der Mieten, unsere Auswahlkriterien und die häufigsten Fehler."
