passions:
  eyebrow: "What keeps me going"
  items:
    - key: rugby
      title: "Sport — rugby first"
      text: "Sport gives me daily discipline and helps me clear my head. Rugby above all: a collective combat sport where you only move forward together. Since this year, I have been part of the Iran national team staff — and we recently won a match against Armenia."
    - key: travel
      title: "Travel"
      text: "Travelling opens me up to the world, professionally and personally. It is my way of forming my own opinion on the cultures and realities of our planet, far from preconceptions."

quote:
  text: "Investing with my clients and supporting them for the entire life of their investment, with one goal: growing their wealth over the years and across projects."
  author: "Eric Fankhauser"

values:
  eyebrow: "What guides me"
  items:
    - title: "Fighting spirit"
      text: "In the face of adversity, you don’t back down: you adapt, get up and move forward."
    - title: "High standards"
      text: "A constant pursuit of performance and excellence, in every project and every detail."
    - title: "Loyalty"
      text: "Lasting relationships: my clients often become friends, sometimes partners."
