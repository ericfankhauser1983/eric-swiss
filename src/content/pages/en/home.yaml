# Home page — EN
seo:
  title: "Eric Fankhauser — Real estate investment in Georgia, strategic consulting & Advisory Board"
  description: "Swiss entrepreneur based in Tbilisi: real estate investment in Georgia with FFI, strategic consulting for SMEs and market entry in Georgia, Advisory Board for Swiss SMEs."

hero:
