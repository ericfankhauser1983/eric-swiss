  cta: "Read my story"

team:
  eyebrow: "The team"
  title: "You never work with me alone"
  text: "Each activity relies on partners and recognised experts in Switzerland, Europe and Georgia."
  cta: "Meet the team"

final:
  title: "Let’s talk about your project"
  text: "A first, no-obligation conversation to understand your goals and see how we can support you."
