# Home page — EN
seo:
  title: "Eric Fankhauser — Real estate investment and business consulting in Georgia"
  description: "Swiss entrepreneur based in Tbilisi: real estate investment in Georgia with FFI, the market leader, and business consulting to set up in Georgia. Advisory Board for Swiss SMEs."

hero:
  eyebrow: "Switzerland · Europe · United Arab Emirates · Georgia"
  title: "Eric Fankhauser"
  subtitle: "Entrepreneur, investor and strategic advisor"
  lead: "Growing wealth and growing a business take the same things: a clear strategy, a strong network and someone who stays by your side over time. That is what my partners and I bring from Tbilisi: to investors who want their capital to work harder, and to business leaders who want to grow their company."
  stats:
    - value: "1,000+"
      label: "clients supported in Georgia with FFI"
    - value: "Millions"
      label: "invested every month for our clients"
    - value: "On the ground"
      label: "a team in Tbilisi and Batumi, and a network at the highest level"

paths:
  eyebrow: "How I can help"
  title: "It all starts with where you stand"
  lead: "Whether you want your capital to work harder, your company to grow or simply to make better decisions day to day, the approach is the same: understand where you are, then build with you the strategy that moves you forward."

pillars:
  items:
    - key: invest
      question: "Is your capital idle or earning too little?"
      kicker: "FFI · Real Estate Asset Management"
      title: "Real estate investment in Georgia"
      text: "With FFI, my company and the market leader: 1,000+ clients supported and several million invested every month in Batumi and Tbilisi, for private investors, family offices and funds."
      cta: "Invest in Georgia"
    - key: consulting
      question: "Does your company need to reach the next level, or set up in Georgia?"
      kicker: "Strategic consulting"
      title: "Strategy, growth and organisation for SMEs"
      text: "An outside perspective to accelerate your business — and a high-level gateway to set up in Georgia."
      cta: "Strategic consulting"
    - key: board
      question: "Do you run a Swiss SME and often decide alone?"
      kicker: "Advisory Board"
      title: "A panel of specialists for your Swiss SME"
      text: "An annual diagnostic and four strategic sessions a year, for CHF 2,500 per month."
      cta: "The Advisory Board"

about:
  eyebrow: "My story"
  title: "From 15-year-old apprentice to international entrepreneur"
  text: "Swissair, New York on 11 September 2001, building a call centre from scratch, restructuring a company, then ten years growing Swiss Auto Glass into the country’s number three. Now based in Tbilisi, I put this experience to work for my clients."
  cta: "Read my story"

team:
  eyebrow: "The team"
  title: "You never work with me alone"
  text: "Each activity relies on partners and recognised experts in Switzerland, Europe and Georgia."
  cta: "Meet the team"

final:
  title: "Let’s talk about your project"
  text: "A first, no-obligation conversation to understand your goals and see how we can support you."
