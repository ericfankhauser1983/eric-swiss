privacy:
  seo:
    title: "Privacy policy"
    description: "Privacy and data protection policy of the eric.swiss website."
  title: "Privacy policy"
  body: |
    ## Data controller
    Eric Fankhauser — eric.fankhauser@francefinance.ae

    ## Data collected
    When you use the simulator, we collect your first name, last name, email address, WhatsApp number and the parameters and results of your simulation. This data is used solely to contact you about your project.

    ## Meeting booking
    Meeting bookings are handled by Calendly. The data you enter is processed in accordance with Calendly’s privacy policy.

    ## Retention period
    Your data is kept for as long as necessary to follow up on your request, and at most three years after the last contact.

    ## Cookies
    This website does not use advertising cookies. Only your language preference is stored in your browser.

    ## Your rights
    In accordance with the Swiss Federal Act on Data Protection (FADP) and the GDPR, you have the right to access, rectify and delete your data. To exercise it, write to eric.fankhauser@francefinance.ae.
