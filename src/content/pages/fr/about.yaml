passions:
  eyebrow: "Ce qui me tient debout"
  items:
    - key: rugby
      title: "Le sport, le rugby d’abord"
      text: "Le sport me donne une discipline au quotidien et me permet de me vider la tête. Le rugby, surtout : un sport de combat collectif, où l’on n’avance qu’ensemble. Depuis cette année, je fais partie du staff de l’équipe nationale d’Iran, avec laquelle nous avons notamment remporté récemment un match face à l’Arménie."
    - key: travel
      title: "Les voyages"
      text: "Voyager m’ouvre au monde, dans ma vie professionnelle comme privée. C’est ma façon de me forger mon propre avis sur les cultures et les réalités de notre planète, loin des idées reçues."

quote:
  text: "Investir avec mes clients et les accompagner pendant toute la vie de leur investissement, avec un seul but : faire croître leur patrimoine au fil des années et des projets."
  author: "Eric Fankhauser"

values:
  eyebrow: "Ce qui me guide"
  items:
    - title: "Combativité"
      text: "Face à l’adversité, on ne recule pas : on s’adapte, on se relève et on avance."
    - title: "Exigence"
      text: "La recherche constante de la performance et de l’excellence, dans chaque projet et chaque détail."
    - title: "Fidélité"
      text: "Des relations qui durent : mes clients deviennent souvent des amis, parfois des associés."
