# Parcours — FR
seo:
  title: "Mon histoire — Eric Fankhauser, entrepreneur suisse à Tbilissi"
  description: "Apprenti chez Swissair à 15 ans, à New York le 11 septembre 2001, fondateur de Swiss Auto Glass puis associé de FFI : le parcours d’Eric Fankhauser."

hero:
  eyebrow: "Mon histoire"
  title: "Avancer, toujours. Même quand le terrain est difficile."
  lead: "Je n’ai jamais suivi de chemin tracé. J’ai appris sur le terrain, encaissé, construit — et je n’ai jamais cessé de chercher à faire mieux."

story:
  - title: "Deux langues, un caractère"
    text: "Je suis né à Genève et je suis originaire des Alpes bernoises. J’ai grandi entre deux langues, le français et le suisse allemand, et entre deux cultures qui m’ont appris très tôt à m’adapter. Très jeune déjà, une évidence s’impose : je veux entreprendre. Un livre agit comme un déclic — Losing My Virginity, de Richard Branson. Plus qu’une biographie, j’y trouve une permission : celle d’oser, de sortir du cadre et de construire ma propre route."
  - title: "Quitter l’école à 15 ans"
    text: "À 15 ans, je choisis l’action plutôt que les bancs de l’école et j’entre en apprentissage chez Swissair. J’y découvre l’exigence d’une grande compagnie, le sens du service et la rigueur d’un monde où chaque détail compte."
  - title: "New York, 2001"
    text: "À 18 ans, Swissair m’envoie pour un an à New York. Le 11 septembre 2001, je suis là. Ce jour-là, je bascule d’un coup dans le monde adulte. Loin de chez moi, j’apprends à faire face seul à l’adversité, à garder la tête froide et à avancer quand tout vacille. Cette leçon ne m’a jamais quitté."
  - title: "Bâtir"
    text: "De retour en Suisse, je reste quelques années dans l’univers du voyage et de l’aviation, puis je rejoins l’automobile chez Carglass. On me confie la création du centre d’appel suisse : en 24 mois, je le fais passer de zéro à trente collaborateurs et contribue à une croissance de plus de 50 % par an. En parallèle, je prends la direction commerciale de l’entreprise. J’y apprends à recruter, à fédérer et à tenir des objectifs ambitieux."
  - title: "Restructurer"
    text: "Je relève ensuite un autre défi : restructurer Elixim, une société de services d’accueil. En deux ans, elle retrouve son équilibre financier et devient la société la plus performante de son groupe. La preuve, pour moi, qu’une organisation claire et une équipe engagée peuvent tout changer."
  - title: "Entreprendre"
    text: "Puis vient le moment de bâtir pour moi. Je fonde Swiss Auto Glass, que je fais grandir pendant plus de dix ans, jusqu’à la hisser à la troisième place nationale. Dix ans de combat quotidien, de victoires et de remises en question, avant de revendre mes parts."
  - title: "Transmettre et investir"
    text: "Après cette revente, je lance mes activités de conseil pour mettre mon expérience au service d’autres dirigeants. En parallèle, je rejoins mon ami Adrien au sein de FFI et j’y prends des parts. Je l’avais d’abord connu comme client, il est devenu un ami, puis mon associé. Aujourd’hui, je vis à Tbilissi et j’accompagne investisseurs et entrepreneurs entre la Suisse, l’Europe, le Golfe et la Géorgie."

