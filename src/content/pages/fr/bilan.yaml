# Landing page « Bilan immobilier » pour les propriétaires en France — FR
# Adresse : eric.swiss/fr/bilan-immobilier/ (non indexée, lien à partager)
seo:
  title: "Bilan immobilier offert — Faites le point sur vos biens en France"
  description: "Valeur réelle, rendement net, dette, fiscalité : en un rendez-vous, faites le point sur votre immobilier en France et repartez avec des scénarios chiffrés. Gratuit et sans engagement."

hero:
  eyebrow: "Bilan immobilier offert · Propriétaires en France"
  title: "Votre immobilier en France vaut-il encore <em>ce que vous croyez</em> ?"
  lead: "Taux en hausse, prix qui reculent, fiscalité qui change chaque année : le contexte a basculé. En un rendez-vous, nous faisons le point sur vos biens et vous repartez avec des scénarios chiffrés : garder, optimiser ou arbitrer."
  proofs:
    - "Gratuit et sans engagement"
    - "Valeur, rendement, dette, fiscalité"
    - "Scénarios chiffrés"

steps:
