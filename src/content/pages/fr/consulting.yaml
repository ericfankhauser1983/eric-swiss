faq:
  eyebrow: "Questions fréquentes"
  title: "Créer et développer une société en Géorgie"
  items:
    - q: "Un étranger peut-il créer une société en Géorgie ?"
      a: "Oui. Un étranger peut détenir 100 % d’une société géorgienne, sans associé local. L’enregistrement se fait auprès de l’Agence nationale du registre public (Maisons de justice), en général en un jour ouvré, et peut se faire à distance par procuration."
    - q: "Quelle est la fiscalité d’une société en Géorgie ?"
      a: "La Géorgie applique le modèle estonien : l’impôt sur les sociétés de 15 % ne s’applique qu’aux bénéfices distribués. Les bénéfices réinvestis ne sont pas imposés et les dividendes sont taxés à 5 %. Des régimes particuliers existent selon l’activité : statut de petite entreprise (1 % du chiffre d’affaires pour les entrepreneurs individuels, sous conditions), zone virtuelle pour les sociétés informatiques, zones franches industrielles."
    - q: "Combien de temps faut-il pour ouvrir un compte bancaire professionnel ?"
      a: "Après l’enregistrement de la société, comptez de quelques jours à quelques semaines selon votre profil et la qualité du dossier. Nous préparons le dossier avec vous et vous mettons en relation directe avec les banques."
    - q: "Pourquoi la Géorgie pour une PME suisse ou européenne ?"
      a: "Pour sa fiscalité, la rapidité de ses démarches, son coût du travail et sa position entre l’Europe et l’Asie. Ses accords de libre-échange avec l’Union européenne, l’AELE et la Chine en font une plateforme régionale pour produire, exporter ou installer des fonctions support."
    - q: "Faut-il une autorisation pour travailler en Géorgie ?"
      a: "Depuis mars 2026, la loi sur la migration de main-d’œuvre peut exiger une autorisation de travail pour certains étrangers qui exercent une activité en Géorgie. Nous vérifions votre situation et vous accompagnons dans les démarches."
    - q: "Comment se déroule votre accompagnement ?"
      a: "Nous commençons par un échange pour comprendre votre projet, puis nous validons l’opportunité, choisissons la structure, préparons l’enregistrement et la banque, et vous ouvrons notre réseau : entreprises, banques, institutions et gouvernement. Nous restons à vos côtés après le lancement."
