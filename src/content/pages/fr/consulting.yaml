georgia:
  eyebrow: "Spécialisation Géorgie"
  title: "S’implanter et se développer en Géorgie"
  text: "La Géorgie offre un environnement fiscal et administratif parmi les plus favorables de la région : une société s’y enregistre en général en un jour ouvré, les bénéfices réinvestis ne sont pas imposés, et le pays a signé des accords de libre-échange avec l’Union européenne, l’AELE (dont la Suisse) et la Chine. Encore faut-il disposer des bons relais pour s’y implanter avec succès."
  services:
    - "Étude de marché et validation de l’opportunité"
    - "Structuration juridique et fiscale de l’implantation"
    - "Relations bancaires et ouverture de comptes"
    - "Mise en relation avec partenaires, fournisseurs et clients"
    - "Relations institutionnelles et accompagnement auprès des autorités"
    - "Recrutement, locaux et lancement opérationnel"

