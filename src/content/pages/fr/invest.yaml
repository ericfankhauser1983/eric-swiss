# Investissement immobilier — Real Estate Asset Management — FR
seo:
  title: "Investir dans l’immobilier en Géorgie (Batumi, Tbilissi) — Real Estate Asset Management"
  description: "Investissement immobilier clé en main en Géorgie : sélection, acquisition, gestion locative et revente à Batumi et Tbilissi. Simulateur cash, plan de paiement ou crédit bancaire."

hero:
  eyebrow: "FFI · Real Estate Asset Management"
  title: "Investir dans l’immobilier en Géorgie avec FFI"
  lead: "Avec FFI, la société que je développe avec mes associés Adrien Boucher et Léo Lawless, nous sélectionnons, acquérons, gérons et revendons des biens à Batumi et Tbilissi pour le compte d’investisseurs suisses, français et belges — avec un objectif unique : faire croître leur patrimoine."

what:
  eyebrow: "Ce que nous faisons"
  title: "Un gestionnaire d’actifs immobiliers, pas un simple vendeur"
  text: "Un investissement réussi se joue sur toute la chaîne : bien acheter, bien gérer, bien revendre. Nous maîtrisons chacune de ces étapes et restons à vos côtés après la signature — pour les arbitrages, les ventes et les réinvestissements."
  steps:
    - title: "Acquisition"
      text: "Sélection rigoureuse du promoteur, du projet et de l’emplacement. Accès aux préventes et négociation des conditions : prix, remise, plan de paiement."
    - title: "Gestion"
      text: "Aménagement clé en main, mise en location courte ou longue durée, suivi des revenus et de l’entretien. Vous percevez vos loyers sans gérer le quotidien."
    - title: "Revente & arbitrage"
      text: "Choix du bon moment pour revendre, réallocation de la plus-value et réinvestissement dans de nouveaux projets : votre patrimoine reste en mouvement."

why:
  eyebrow: "Pourquoi nous le faisons"
  title: "Investir avec nos clients et les accompagner toute la vie de leur investissement"
  text: "Notre mission est simple : investir avec nos clients et les accompagner pendant toute la durée de leur investissement — arbitrages, ventes, réinvestissements — avec pour seul but de faire croître leur patrimoine au fil des années et des projets."

