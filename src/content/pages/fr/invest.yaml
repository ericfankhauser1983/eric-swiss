criteria:
  eyebrow: "Nos critères de sélection"
  title: "Trois filtres avant toute recommandation"
  items:
    - title: "Le promoteur"
      text: "Solidité financière, historique de livraison, qualité de construction et respect des engagements."
    - title: "Le projet"
      text: "Conception, prestations, services de gestion locative et potentiel de revente."
    - title: "La localisation"
      text: "Attractivité touristique ou résidentielle, accessibilité, environnement et perspectives du quartier."

financing:
  eyebrow: "Financement"
  title: "Trois façons d’acheter"
  items:
    - title: "Paiement à 100 %"
      text: "Le règlement intégral à la signature permet de négocier la meilleure remise sur le prix."
    - title: "Plan de paiement"
      text: "Un apport à la signature, puis le solde en mensualités sans intérêts directement auprès du promoteur pendant la construction."
    - title: "Crédit bancaire"
      text: "Un apport à la signature, puis le solde financé par une banque géorgienne à la livraison : l’effet de levier au service de votre rendement."

payment:
  eyebrow: "Modes de paiement"
  title: "Payer simplement, où que vous soyez"
  items:
    - title: "Virement bancaire"
      text: "Virement international en USD, EUR ou CHF, directement au promoteur."
    - title: "Cryptomonnaies"
      text: "Le paiement en cryptomonnaies est possible pour régler tout ou partie de votre acquisition."
    - title: "Compte bancaire en Géorgie"
      text: "Nous vous accompagnons dans l’ouverture d’un compte bancaire local pour vos paiements et vos loyers."

partner:
  eyebrow: "Ma société"
  title: "FFI, l’investissement international sur mesure"
  text: "FFI est la société de conseil en investissement et en gestion de patrimoine international dont je suis associé. Plus de 15 ans d’expérience, plus de 1 200 clients accompagnés et 13 pays explorés : immobilier à l’étranger, structuration de holdings, fiscalité transfrontalière et accompagnement bancaire."
  cta: "Découvrir FFI"

