      text: "0 % d’impôt sur la plus-value après deux ans et 5 % sur les loyers."
    - title: "Un marché en rattrapage"
      text: "9 % de plus-value moyenne par an au niveau national, 15 % à Batumi."
    - title: "Un achat simple à distance"
      text: "Un appartement s’achète en pleine propriété, même sans résider en Géorgie. Paiement par virement ou en cryptomonnaies."
