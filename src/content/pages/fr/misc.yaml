privacy:
  seo:
    title: "Politique de confidentialité"
    description: "Politique de confidentialité et protection des données du site eric.swiss."
  title: "Politique de confidentialité"
  body: |
    ## Responsable du traitement
    Eric Fankhauser — contact@eric.swiss

    ## Données collectées
    Lorsque vous utilisez le simulateur, nous collectons votre prénom, nom, adresse e-mail, numéro WhatsApp ainsi que les paramètres et résultats de votre simulation. Ces données sont utilisées exclusivement pour vous recontacter au sujet de votre projet.

    ## Prise de rendez-vous
    La réservation de rendez-vous est assurée par Calendly. Les données saisies sont traitées selon la politique de confidentialité de Calendly.

    ## Durée de conservation
    Vos données sont conservées le temps nécessaire au suivi de votre demande, puis au maximum trois ans après le dernier contact.

    ## Cookies
    Ce site n’utilise pas de cookies publicitaires. Seule votre préférence de langue est enregistrée dans votre navigateur.

    ## Vos droits
    Conformément à la loi fédérale suisse sur la protection des données (nLPD) et au RGPD, vous disposez d’un droit d’accès, de rectification et de suppression de vos données. Pour l’exercer, écrivez à contact@eric.swiss.
