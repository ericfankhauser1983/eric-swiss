seo:
  title: "Presse et médias — Eric Fankhauser"
  description: "Interviews et articles consacrés à Eric Fankhauser, entrepreneur suisse basé à Tbilissi : investissement immobilier en Géorgie, conseil d’entreprise et parcours."
lead: "Interviews, articles et apparitions dans les médias."
eyebrow: "Dans la presse"
title: "Ce que la presse retient de mon parcours"
read: "Lire l’interview (PDF)"
items:
  - media: "L’Investisseur Immobilier Magazine"
    meta: "N° 4 · Septembre / Octobre 2026 · Portrait et interview"
    title: "« Nous ne sommes pas une agence »"
    text: "Dans un portrait et une interview de cinq pages, le magazine revient sur mon parcours et sur la façon dont nous investissons en Géorgie avec FFI : ma rencontre avec Adrien Boucher, notre premier achat à Batumi, ce qui distingue Tbilissi de Batumi, l’achat en pleine propriété à distance, la fiscalité des loyers, nos critères de sélection des programmes et les erreurs que nous voyons le plus souvent."
    cover: "https://i.calameoassets.com/260902150349-8ed06072ccf614e7a555500dcd2e429b/large.jpg"
    url: "https://www.calameo.com/read/00816981990a05c059208?page=38"
    cta: "Lire l’article (pages 38 à 42)"
  - media: "Monde Économique"
    meta: "N° 53 · 2023 · En couverture"
    title: "« Placer le client au centre de tout ce que nous faisons »"
    text: "Le magazine suisse des chefs d’entreprise et décideurs m’a consacré sa couverture et son interview « L’Invité », alors que je dirigeais Swiss Auto Glass, l’un des trois acteurs majeurs du vitrage automobile en Suisse. J’y raconte le rôle de l’équipe, un service client joignable 24 h/24 dans toutes les langues nationales, et le choix stratégique qui nous a permis de nous démarquer face aux géants du secteur."
    cover: "/images/presse/monde-economique-53.jpg"
    pdf: "/presse/monde-economique-53-interview-eric-fankhauser.pdf"
